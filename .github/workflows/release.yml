name: Release (Windows)

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  repository_dispatch:
    types:
      - biggie-pos-updated

jobs:
  # ── Step 1: create the GitHub Release once ────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # biggie_pos was updated — auto-bump the patch version past the latest tag
            LATEST=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            VER="${LATEST:-v1.0.0}"; VER="${VER#v}"
            IFS=. read -r MAJ MIN PAT <<< "$VER"
            TAG="v$MAJ.$MIN.$((PAT + 1))"
            echo "Auto bump: ${LATEST:-none} -> $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.resolve-tag.outputs.tag }}";
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Base ${tag}`,
                body: `## Base ${tag}\n\n### Download\n| Platform | File |\n|----------|------|\n| Windows 10/11 (setup wizard) | \`Base_*_x64-setup.exe\` |\n| Windows 10/11 (MSI) | \`Base_*_x64_en-US.msi\` |\n\n### First Run\n- Launch **Base**, click the gear icon on the login screen\n- Set the POS API server (e.g. \`http://localhost:3002\`) and tenant API\n- Updates are delivered automatically via GitHub Releases`,
                draft: true,
                prerelease: false,
              });
              return data.id;
            } catch (e) {
              // Release already exists (e.g. re-run) — reuse it.
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 30,
              });
              const sameTag = releases.filter((r) => r.tag_name === tag);
              if (sameTag.length === 0) throw e;
              const keep = sameTag.find((r) => !r.draft) || sameTag[0];
              for (const r of sameTag) {
                if (r.id !== keep.id && r.draft) {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: r.id,
                  });
                  console.log(`Deleted duplicate draft release ${r.id}`);
                }
              }
              console.log(`Reusing existing release ${keep.id} for tag ${tag}`);
              return keep.id;
            }

  # ── Step 2: build the Tauri app + signed updater artifacts ───────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # The shell repo — checked out as `base_desktop` so ../biggie_pos resolves.
      - uses: actions/checkout@v4
        with:
          path: base_desktop

      # The frontend lives in a separate repo; it must be a sibling directory
      # because src-tauri/tauri.conf.json sets frontendDist to ../../biggie_pos/dist
      - uses: actions/checkout@v4
        with:
          repository: Hospitality-POS/biggie_pos
          ref: master
          # public repo — github.token suffices; set POS_REPO_PAT if it goes private
          token: ${{ secrets.POS_REPO_PAT || github.token }}
          path: biggie_pos

      # pnpm 11 requires Node >= 22.13 (uses node:sqlite) — install Node first
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "base_desktop/src-tauri -> target"

      - name: Install frontend dependencies (biggie_pos)
        run: pnpm -C biggie_pos install --frozen-lockfile=false

      - name: Install shell dependencies (base_desktop)
        run: pnpm -C base_desktop install

      - name: Sync version from tag
        working-directory: base_desktop
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          VER="${TAG#v}"
          echo "Syncing version to $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Build Tauri app (Windows) + publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: base_desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc

  # ── Step 3: publish the draft once assets are attached ────────────────────
  publish-release:
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release_id }},
                draft: false,
              });
            } catch (error) {
              if (error.status === 422) {
                console.log('A published release already exists for this tag — nothing to publish');
                return;
              }
              throw error;
            }
